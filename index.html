<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin Team & Dresscode - BRI Banyuwangi</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<!-- Library Canvas Confetti -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
<style>
:root {
    --bri-blue: #00529B;
    --bri-blue-dark: #307FE2;
    --bwi-gold: #71C5E8;
    --bwi-gold-dark: #00529B;
    --card-bg: rgba(255, 255, 255, 0.96);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Plus Jakarta Sans', sans-serif;
}

body {
    background-color: var(--bri-blue-dark);
    background-image: 
        radial-gradient(circle at 50% 50%, rgba(255, 152, 0, 0.15) 0%, transparent 60%),
        radial-gradient(circle at 0% 0%, rgba(0, 82, 155, 0.8) 0%, transparent 50%),
        radial-gradient(circle at 100% 100%, rgba(0, 82, 155, 0.8) 0%, transparent 50%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.05) 25%, transparent 25%),
        linear-gradient(225deg, rgba(255, 255, 255, 0.05) 25%, transparent 25%),
        linear-gradient(45deg, rgba(255, 255, 255, 0.05) 25%, transparent 25%),
        linear-gradient(315deg, rgba(255, 255, 255, 0.05) 25%, var(--bri-blue-dark) 25%);
    background-position: 0 0, 0 0, 0 0, 20px 0, 20px 0, 0 0, 0 0;
    background-size: 100% 100%, 100% 100%, 100% 100%, 40px 40px, 40px 40px, 40px 40px, 40px 40px;
    background-attachment: fixed;
    color: #1E293B;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 30px 20px;
    position: relative;
    overflow-x: hidden;
}

body::before {
    content: '';
    position: absolute;
    width: 400px;
    height: 400px;
    background: rgba(0, 82, 155, 0.6);
    filter: blur(120px);
    border-radius: 50%;
    top: 10%;
    left: 10%;
    z-index: 0;
}

body::after {
    content: '';
    position: absolute;
    width: 350px;
    height: 350px;
    background: rgba(255, 152, 0, 0.25);
    filter: blur(110px);
    border-radius: 50%;
    bottom: 10%;
    right: 10%;
    z-index: 0;
}

.container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1200px;
    background: var(--card-bg);
    backdrop-filter: blur(12px);
    border-radius: 32px;
    padding: 48px 56px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.6);
}

.header {
    text-align: center;
    margin-bottom: 36px;
}

.badge {
    display: inline-block;
    background: #E0F2FE;
    color: var(--bri-blue);
    font-size: 16px;
    font-weight: 700;
    padding: 10px 24px;
    border-radius: 24px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 12px;
}

h1 {
    font-size: 46px;
    font-weight: 800;
    color: var(--bri-blue-dark);
}

h1 span {
    color: var(--bwi-gold);
}

.area {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 36px;
}

@media (max-width: 640px) {
    .area {
        grid-template-columns: 1fr;
    }
    .container {
        padding: 24px;
    }
}

.input-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.input-group h3 {
    font-size: 20px;
    font-weight: 700;
    color: #475569;
    display: flex;
    align-items: center;
    gap: 10px;
}

textarea {
    width: 100%;
    height: 260px;
    padding: 20px;
    font-size: 21.5px;
    font-weight: 700;
    line-height: 1.5;
    color: #1E293B;
    border: 2px solid #E2E8F0;
    border-radius: 18px;
    outline: none;
    resize: none;
    transition: all 0.2s ease;
    background: #F8FAFC;
}

textarea:focus {
    border-color: var(--bri-blue);
    background: #FFFFFF;
    box-shadow: 0 0 0 5px rgba(0, 82, 155, 0.15);
}

.btn-spin {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin: 44px auto 0;
    padding: 24px 72px;
    font-size: 24px;
    font-weight: 800;
    border: none;
    border-radius: 60px;
    cursor: pointer;
    background: var(--bwi-gold);
    color: white;
    box-shadow: 0 12px 30px -5px rgba(113, 197, 232, 0.6);
    transition: all 0.2s ease;
    text-transform: uppercase;
    letter-spacing: 1.5px;
}

.btn-spin:hover {
    background: var(--bwi-gold-dark);
    transform: translateY(-3px);
    box-shadow: 0 18px 35px -5px rgba(0, 82, 155, 0.4);
}

.btn-spin:active {
    transform: translateY(0);
}

.table-wrapper {
    margin-top: 44px;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid #E2E8F0;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}

th {
    background: var(--bri-blue);
    color: white;
    font-size: 19px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 22px;
}

td {
    padding: 22px;
    border-bottom: 1px solid #F1F5F9;
    text-align: center;
    font-size: 20px;
}

tr:last-child td {
    border-bottom: none;
}

tr:nth-child(even) td {
    background: #F8FAFC;
}

.spin-dresscode {
    animation: spin .08s infinite;
}

@keyframes spin {
    from { transform: translateY(-3px); opacity: 0.8; }
    to { transform: translateY(3px); opacity: 1; }
}

.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 43, 73, 0.9);
    backdrop-filter: blur(8px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
}

.modal-overlay.active {
    opacity: 1;
    visibility: visible;
}

.modal-content {
    text-align: center;
    color: white;
}

.modal-title {
    font-size: 26px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--bwi-gold);
    margin-bottom: 24px;
}

.countdown-number {
    font-size: 180px;
    font-weight: 800;
    line-height: 1;
    color: #FFFFFF;
    text-shadow: 0 0 50px rgba(113, 197, 232, 0.9);
    animation: pop 0.4s ease infinite alternate;
}

@keyframes pop {
    0% { transform: scale(0.95); }
    100% { transform: scale(1.05); }
}
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <span class="badge">BRI CABANG BANYUWANGI</span>
        <h1>SPIN TEAM & <span>DRESSCODE</span></h1>
    </div>

    <div class="area">
        <div class="input-group">
            <h3>👥 NAMA TEAM</h3>
            <textarea id="nama">MBM 1 Bp.Bambs 
MBM 2 Bp.Erwan 
MBM 3 Bp.Salim 
MBM 4 Ibu.Anis 
RM Cabang 
OPS Cabang 
KCP</textarea>
        </div>
        <div class="input-group">
            <h3>📝 URUTAN PENAMPILAN</h3>
            <textarea id="jurusan">URUTAN 1
URUTAN 2
URUTAN 3
URUTAN 4
URUTAN 5
URUTAN 6
URUTAN 7</textarea>
        </div>
    </div>

    <button class="btn-spin" onclick="startWithCountdown()">🎯 SPIN SEKARANG</button>

    <div class="table-wrapper">
        <table id="hasil">
            <thead>
                <tr>
                    <th>NAMA TEAM</th>
                    <th>URUTAN PENAMPILAN</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="2" style="color: #94A3B8; font-style: italic; padding: 32px;">Klik tombol SPIN untuk mengacak urutan penampilan.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="modal-overlay" id="countdownModal">
    <div class="modal-content">
        <div class="modal-title">SPIN DIMULAI DALAM</div>
        <div class="countdown-number" id="countdownText">5</div>
    </div>
</div>

<script>
// --- SISTEM SUARA ELEKTRONIK (WEB AUDIO API) ---
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
}

// 1. Suara Detik Jam (Tick-Tock Hitung Mundur)
function playTickSound() {
    initAudio();
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, audioCtx.currentTime); 
    osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.05);

    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
}

// 2. Suara Roda Pengacakan (Click-Shuffle Sound)
function playSpinClickSound() {
    initAudio();
    let osc = audioCtx.createOscillator();
    let gain = audioCtx.createGain();

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(200 + Math.random() * 300, audioCtx.currentTime);

    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 0.04);
}

// 3. Suara Selebrasi Fanfare + TEPUK TANGAN MERIAH (APPLAUSE)
function playVictorySound() {
    initAudio();

    // Fanfare Jingle (Tanda Menang)
    const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
    notes.forEach((freq, idx) => {
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();

        osc.type = 'triangle';
        osc.frequency.value = freq;

        let startTime = audioCtx.currentTime + (idx * 0.08);
        gain.gain.setValueAtTime(0.3, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.5);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(startTime);
        osc.stop(startTime + 0.5);
    });

    // Generating Sound Tepuk Tangan Meriah (Applause Noise Buffer)
    let duration = 3.5; // Tepuk tangan berdurasi 3.5 detik
    let bufferSize = audioCtx.sampleRate * duration;
    let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    let output = buffer.getChannelData(0);

    for (let i = 0; i < bufferSize; i++) {
        output[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 1.8));
    }

    let whiteNoise = audioCtx.createBufferSource();
    whiteNoise.buffer = buffer;

    let filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
    filter.Q.setValueAtTime(0.5, audioCtx.currentTime);

    let gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

    whiteNoise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    whiteNoise.start(audioCtx.currentTime + 0.2);
}

// --- EFEK CONFETTI & PETASAN SUPER MERIAH ---
function triggerFireworksAndConfetti() {
    let duration = 3.5 * 1000; 
    let end = Date.now() + duration;

    confetti({
        particleCount: 150,
        spread: 100,
        startVelocity: 60,
        scalar: 1.2,
        origin: { x: 0, y: 0.8 },
        zIndex: 2000
    });
    confetti({
        particleCount: 150,
        spread: 100,
        startVelocity: 60,
        scalar: 1.2,
        origin: { x: 1, y: 0.8 },
        zIndex: 2000
    });

    let interval = setInterval(function() {
        let timeLeft = end - Date.now();

        if (timeLeft <= 0) {
            return clearInterval(interval);
        }

        let particleCount = 60 * (timeLeft / duration);

        confetti({
            particleCount: particleCount,
            startVelocity: 45,
            spread: 360,
            ticks: 80,
            origin: { x: randomInRange(0.1, 0.4), y: Math.random() - 0.2 },
            colors: ['#00529B', '#71C5E8', '#FF9800', '#FFFFFF', '#FFD700'],
            scalar: 1.1,
            zIndex: 2000
        });

        confetti({
            particleCount: particleCount,
            startVelocity: 45,
            spread: 360,
            ticks: 80,
            origin: { x: randomInRange(0.6, 0.9), y: Math.random() - 0.2 },
            colors: ['#00529B', '#71C5E8', '#FF9800', '#FFFFFF', '#FFD700'],
            scalar: 1.1,
            zIndex: 2000
        });
    }, 200);

    setTimeout(() => {
        confetti({
            particleCount: 100,
            angle: 90,
            spread: 120,
            startVelocity: 25,
            decay: 0.92,
            scalar: 1.3,
            origin: { x: 0.5, y: -0.1 },
            colors: ['#FFD700', '#71C5E8', '#00529B'],
            zIndex: 2000
        });
    }, 400);
}

function randomInRange(min, max) {
    return Math.random() * (max - min) + min;
}

// --- FUNGSI UTAMA ---
function shuffle(array){
    for(let i=array.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [array[i],array[j]]=[array[j],array[i]];
    }
    return array;
}

function startWithCountdown() {
    initAudio(); 
    let nama = document.getElementById("nama").value.trim().split("\n").filter(x => x.trim() != "");
    let jurusan = document.getElementById("jurusan").value.trim().split("\n").filter(x => x.trim() != "");

    if (nama.length === 0 || jurusan.length === 0) {
        alert("Data tim atau dresscode tidak boleh kosong!");
        return;
    }

    if (nama.length !== jurusan.length) {
        alert("Jumlah nama dan jurusan harus sama!");
        return;
    }

    const modal = document.getElementById("countdownModal");
    const countdownText = document.getElementById("countdownText");
    
    modal.classList.add("active");
    let count = 5;
    countdownText.innerText = count;
    
    playTickSound();

    let timer = setInterval(() => {
        count--;
        if (count > 0) {
            countdownText.innerText = count;
            playTickSound();
        } else {
            clearInterval(timer);
            modal.classList.remove("active");
            
            spin();
        }
    }, 1000);
}

function spin(){
    let nama = document.getElementById("nama").value.trim().split("\n").filter(x => x.trim() != "");
    let jurusan = document.getElementById("jurusan").value.trim().split("\n").filter(x => x.trim() != "");
    let tbody = document.querySelector("#hasil tbody");

    let startTime = Date.now();
    let totalDuration = 8000; // Durasi diubah menjadi 8 Detik (8000 ms)

    function loop() {
        let elapsed = Date.now() - startTime;
        let progress = elapsed / totalDuration;

        if (progress < 1) {
            tbody.innerHTML = "";
            let acak = shuffle([...jurusan]);
            
            // Nama Team TETAP DIAM, Hanya Dresscode yang diacak
            nama.forEach((n, i) => {
                tbody.innerHTML += `
                <tr>
                    <td><b>${n}</b></td>
                    <td class="spin-dresscode" style="color: #64748B;">${acak[i]}</td>
                </tr>
                `;
            });
            
            playSpinClickSound();

            // Formula perlambatan bertahap dari sangat cepat ke makin lambat selama 8 detik
            let currentDelay = 35 + Math.pow(progress, 3) * 750; 
            setTimeout(loop, currentDelay);
        } else {
            // Hasil Akhir Terkunci Pas 8 Detik
            tbody.innerHTML = "";
            let final = shuffle([...jurusan]);
            nama.forEach((n, i) => {
                tbody.innerHTML += `
                <tr>
                    <td><b>${n}</b></td>
                    <td style="color:#00529B;font-weight:bold;font-size:23px">
                        ${final[i]}
                    </td>
                </tr>
                `;
            });
            
            // Panggil Suara Selebrasi + Tepuk Tangan Meriah + Fireworks/Confetti
            playVictorySound();
            triggerFireworksAndConfetti();
        }
    }

    loop();
}
</script>

</body>
</html>
